  <style>
    :root {
      --maxw: 980px;
      --text: #111318;
      --muted: rgba(17, 19, 24, 0.72);
      --muted2: rgba(17, 19, 24, 0.58);
      --border: rgba(17, 19, 24, 0.16);
      --bg: #ffffff;
      --accent: #1f4fd6;
      --focus: 0 0 0 4px rgba(31, 79, 214, 0.18);
      --sans: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --serif: "Source Serif 4", ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      line-height: 1.7;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    a:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 8px; }

    .skip {
      position: absolute;
      left: -999px;
      top: 0;
      padding: 10px 12px;
      background: #000;
      color: #fff;
      border-radius: 10px;
      z-index: 9999;
      font-family: var(--sans);
      font-weight: 600;
      font-size: 13px;
    }
    .skip:focus { left: 12px; top: 12px; }

    .container { max-width: var(--maxw); margin: 0 auto; padding: 0 18px; }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 20px 0 14px 0;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
    }

    .header-grid {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
      text-align: left;
      min-width: 0;
    }

    .brand-link {
      font-family: var(--serif);
      font-weight: 820;
      letter-spacing: -0.035em;
      font-size: clamp(26px, 3.2vw, 40px);
      line-height: 1.05;
      display: inline-block;
      position: relative;
      padding-bottom: 10px;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .brand-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 62px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), rgba(31, 79, 214, 0.25));
      opacity: 0.95;
      transition: width 180ms ease;
    }

    .brand-link:hover { text-decoration: none; }
    .brand-link:hover::after { width: 92px; }

    /* Navigation: centered pill */
    nav.primary {
      align-self: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      border: 1px solid rgba(17, 19, 24, 0.14);
      background: rgba(255, 255, 255, 0.70);
      box-shadow: 0 10px 30px rgba(17, 19, 24, 0.08);
      font-family: var(--sans);
    }

    nav.primary a {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      transition: background 140ms ease, color 140ms ease, transform 140ms ease, border-color 140ms ease;
      white-space: nowrap;
    }

    nav.primary a:hover {
      text-decoration: none;
      color: var(--text);
      background: rgba(17, 19, 24, 0.05);
      border-color: rgba(17, 19, 24, 0.10);
      transform: translateY(-1px);
    }

    nav.primary a:active { transform: translateY(0px); }

    nav.primary a[aria-current="page"] {
      color: var(--text);
      background: rgba(31, 79, 214, 0.10);
      border-color: rgba(31, 79, 214, 0.22);
      box-shadow: inset 0 0 0 1px rgba(31, 79, 214, 0.10);
      text-decoration: none;
    }

    @media (max-width: 760px) {
      .header-grid { gap: 10px; }

      nav.primary {
        width: 100%;
        flex-wrap: wrap;
        justify-content: center;
        border-radius: 18px;
      }
    }

    main { padding: 34px 0 36px 0; }

    h1 {
      margin: 0 0 10px 0;
      font-family: var(--serif);
      font-size: 30px;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      font-family: var(--serif);
    }

    footer {
      margin-top: 40px;
      padding: 18px 0 28px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--sans);
      font-size: 12.5px;
    }

    .footnote {
      display: flex;
      justify-content: center;
      text-align: center;
      padding: 0 10px;
    }

    ::selection { background: rgba(31, 79, 214, 0.16); }
