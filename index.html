  <style>
    :root {
      --bg: #020617;
      --bg-elevated: rgba(15, 23, 42, 0.95);
      --bg-soft: rgba(15, 23, 42, 0.8);
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --accent-strong: #0ea5e9;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border-subtle: rgba(148, 163, 184, 0.25);
      --radius-lg: 18px;
      --radius-xl: 28px;
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.85);
      --shadow-nav: 0 12px 30px rgba(15, 23, 42, 0.9);
      --max-width: 1120px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 55%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.18), transparent 55%),
        var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .site-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top navigation */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(18px);
      background: linear-gradient(to bottom, rgba(2, 6, 23, 0.95), rgba(2, 6, 23, 0.75), transparent);
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: var(--shadow-nav);
    }

    .nav-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-avatar {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.7);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.9);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .brand-role {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.85rem;
    }

    .nav-link {
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      color: var(--muted);
      border: 1px solid transparent;
      transition: all 0.18s ease-out;
    }

    .nav-link:hover {
      color: var(--text);
      border-color: rgba(148, 163, 184, 0.6);
      background-color: rgba(15, 23, 42, 0.9);
    }

    .nav-link.is-active {
      color: var(--accent-strong);
      border-color: rgba(56, 189, 248, 0.7);
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.18), rgba(15, 23, 42, 0.95));
      font-weight: 500;
    }

    .nav-cta {
      padding: 0.45rem 0.95rem;
      border-radius: 999px;
      border: none;
      background: radial-gradient(circle at top left, #38bdf8, #2563eb);
      color: #0b1120;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      box-shadow: 0 14px 40px rgba(37, 99, 235, 0.5);
    }

    .nav-cta span.icon {
      font-size: 0.95rem;
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }
    }

    /* Main content */

    main {
      flex: 1;
    }

    .page {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 2.5rem 1.5rem 3rem;
    }

    /* Hero */

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(0, 1.3fr);
      gap: 2.5rem;
      align-items: center;
      margin-top: 1.75rem;
    }

    .hero-text {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.6rem 0.2rem 0.25rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.4);
      font-size: 0.75rem;
      color: var(--muted);
      width: fit-content;
      backdrop-filter: blur(12px);
    }

    .hero-kicker-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: radial-gradient(circle, #22c55e, #15803d);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.9);
    }

    .hero-title {
      font-size: clamp(2.3rem, 2.7vw + 1rem, 2.9rem);
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .hero-subtitle {
      font-size: 1rem;
      color: var(--muted);
      max-width: 35rem;
    }

    .hero-highlight {
      color: var(--accent-strong);
      font-weight: 500;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .hero-tag {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #e0f2fe;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .btn-primary,
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.7rem 1rem;
      font-size: 0.85rem;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-primary {
      background: radial-gradient(circle at top left, #38bdf8, #2563eb);
      color: #0b1120;
      font-weight: 600;
      box-shadow: 0 18px 45px rgba(37, 99, 235, 0.6);
    }

    .btn-ghost {
      background: rgba(15, 23, 42, 0.9);
      border-color: rgba(148, 163, 184, 0.6);
      color: var(--muted);
    }

    .btn-ghost:hover {
      border-color: rgba(148, 163, 184, 0.9);
      color: var(--text);
    }

    .btn-icon {
      font-size: 1rem;
    }

    /* Hero card with photo */

    .hero-card {
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.3), rgba(15, 23, 42, 0.98));
      border-radius: var(--radius-xl);
      padding: 1.35rem;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(148, 163, 184, 0.45);
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      position: relative;
      overflow: hidden;
    }

    .hero-photo-wrap {
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(15, 23, 42, 0.9);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.85);
    }

    .hero-photo {
      width: 100%;
      height: auto;
      display: block;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
    }

    .hero-meta-left {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .hero-meta-label {
      color: var(--muted);
    }

    .hero-meta-value {
      font-weight: 500;
    }

    .hero-meta-badge {
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.55);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .hero-meta-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fbbf24;
    }
