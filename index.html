  <!-- Simple styles for layout -->
  <style>
    :root {
      --primary: #226e93;
      --primary-dark: #1e6c93;
      --text-main: #212121;
      --text-muted: #555555;
      --bg-main: #f2f2f2;
      --bg-header: #226e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Lato", Arial, sans-serif;
      color: var(--text-main);
      background-color: white;
      line-height: 1.6;
    }

    header {
      background: var(--bg-header);
      color: #ffffff;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .site-title a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 300;
      font-size: 1.1rem;
      letter-spacing: 0.03em;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      padding: 0.25rem 0.5rem;
      border-radius: 3px;
      transition: background 0.2s, color 0.2s;
    }

    nav a:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    main {
      background: var(--bg-main);
      min-height: 100vh;
    }

    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 3rem;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1.5fr);
      gap: 2rem;
      align-items: center;
    }

    .hero-text h1 {
      font-size: 2rem;
      font-weight: 300;
      color: var(--primary-dark);
      margin-bottom: 0.75rem;
    }

    .hero-text h2 {
      font-size: 1.2rem;
      font-weight: 400;
      margin-bottom: 0.75rem;
    }

    .hero-text small {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
