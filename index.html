  <!-- Styles -->
  <style>
    :root {
      --primary: #226e93;
      --primary-dark: #1e6c93;
      --primary-light: #49aad4;
      --bg: #f2f2f2;
      --text: #212121;
      --text-muted: #555555;
      --nav-bg: #212121;
      --white: #ffffff;
      --border: #dddddd;
      --shadow-soft: 0 6px 20px rgba(0,0,0,0.08);
      --radius-lg: 16px;
      --radius-xl: 24px;
      --max-width: 1100px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "Lato", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background-color: var(--bg);
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Header and navigation */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: var(--nav-bg);
      color: var(--white);
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .nav-container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0.4rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .site-title a {
      color: var(--white);
      font-size: 1.05rem;
      font-weight: 300;
      letter-spacing: 0.03em;
      text-decoration: none;
      white-space: nowrap;
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--white);
      font-size: 0.95rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    nav a:hover,
    nav a[aria-current="page"] {
      background-color: var(--primary-light);
      color: var(--white);
    }

    /* Layout */

    main {
      max-width: var(--max-width);
      margin: 1.75rem auto 3rem auto;
      padding: 0 1rem;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2.5fr);
      gap: 2rem;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .hero-text {
      background: linear-gradient(145deg, #ffffff, #f8fbfd);
      border-radius: var(--radius-xl);
      padding: 1.75rem 2rem;
      box-shadow: var(--shadow-soft);
    }

    .hero-title {
      font-size: 2.1rem;
      font-weight: 300;
      color: var(--primary-dark);
      letter-spacing: 0.04em;
      margin: 0 0 0.4rem 0;
    }

    .hero-subtitle {
      font-size: 1.15rem;
      font-weight: 400;
      color: var(--text-muted);
      margin: 0 0 1.2rem 0;
    }

    .position-lines {
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 0.7rem;
    }

    .position-lines strong {
      font-weight: 700;
    }

    .hero-email {
      font-size: 0.9rem;
      margin-top: 0.3rem;
      color: var(--text-muted);
    }

    .hero-email strong {
      font-weight: 700;
    }

    .hero-links {
      margin-top: 1.3rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .btn-ghost,
    .btn-solid {
      font-size: 0.9rem;
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      border: 1px solid var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .btn-solid {
      background-color: var(--primary);
      color: var(--white);
    }

    .btn-solid:hover {
      background-color: var(--primary-dark);
      border-color: var(--primary-dark);
      text-decoration: none;
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--primary);
    }

    .btn-ghost:hover {
      background-color: rgba(34, 110, 147, 0.08);
      text-decoration: none;
    }

    .emoji {
      font-size: 1.1em;
    }

    .hero-photo-card {
      background-color: var(--white);
      border-radius: var(--radius-xl);
      padding: 0.9rem;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .hero-photo-card img {
      width: 100%;
      display: block;
      border-radius: var(--radius-lg);
      object-fit: cover;
    }

    .photo-caption {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .photo-caption span {
      display: block;
    }

    .photo-caption span.fa {
      font-style: italic;
    }

    /* Split section – Twitter */

    .split-section {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2.2fr);
      gap: 1.8rem;
      align-items: flex-start;
    }

    .card {
      background-color: var(--white);
      border-radius: var(--radius-xl);
      padding: 1.4rem 1.6rem;
      box-shadow: var(--shadow-soft);
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--primary-dark);
      margin: 0 0 0.7rem 0;
    }

    .section-text {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-muted);
      margin: 0.2rem 0;
    }

    .twitter-card {
      min-height: 260px;
    }

    .twitter-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.6rem;
    }

    /* Footer */

    footer {
      border-top: 1px solid var(--border);
      padding: 1.2rem 1rem 2rem 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      background-color: #f7f7f7;
    }

    .footer-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.6rem;
    }

    /* Responsive */

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }
      .hero-photo-card {
        max-width: 380px;
        margin: 0 auto;
      }
      .split-section {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .nav-container {
        flex-direction: column;
        align-items: flex-start;
      }
      nav ul {
        justify-content: flex-start;
      }
      .hero-title {
        font-size: 1.8rem;
      }
    }
  </style>
